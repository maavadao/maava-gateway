name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The A2UI canvas sources are not vendored; use the prebuilt bundle like Dockerfile.cloud does.
      - run: OPENCLAW_A2UI_SKIP_MISSING=1 pnpm build
      - run: pnpm ui:build
